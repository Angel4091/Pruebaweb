# =====================================================================
# Orígenes SV · NginX como proxy inverso (D-12)
#
#   Navegador ──HTTPS 443──▶ NginX ──▶ frontend (apps/frontend/dist, archivos estáticos)
#                                  └─▶ /api ──HTTP──▶ Express en 127.0.0.1:3000 ──▶ PostgreSQL
#
# Instalación en un servidor Ubuntu o Debian (ver README, sección "Despliegue"):
#   1. Copia este archivo a /etc/nginx/sites-available/origenes y enlázalo:
#        sudo ln -s /etc/nginx/sites-available/origenes /etc/nginx/sites-enabled/
#   2. Cambia origenes.example.com por tu dominio: en los dos server_name y en las dos rutas del certificado.
#   3. Pide el certificado con Let's Encrypt:  sudo certbot certonly --webroot -w /var/www/certbot -d tu-dominio
#   4. Revisa y recarga:  sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (TLS) protege el canal entre el navegador y el servidor: nadie en la red puede
# leer ni cambiar lo que viaja (contraseñas, tokens, ventas). No reemplaza el JWT ni los
# roles: la API sigue respondiendo 401 sin token y 403 sin permiso.
# =====================================================================

# La API de Express. keepalive reutiliza las conexiones en lugar de abrir una por petición.
upstream origenes_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

# ---------------------------------------------------------------------
# Puerto 80 (HTTP): solo sirve para validar el certificado y redirigir a HTTPS.
# ---------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name origenes.example.com;
  server_tokens off;

  # Let's Encrypt comprueba el dominio pidiendo un archivo en esta carpeta.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------------------------------------------------------------------
# Puerto 443 (HTTPS): la aplicación.
# ---------------------------------------------------------------------
server {
  # "ssl http2" funciona en NginX 1.24 (Ubuntu 24.04) y en las versiones nuevas.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name origenes.example.com;
  server_tokens off; # no anunciar la versión de NginX

  # Certificado y llave privada del dominio (Let's Encrypt los renueva solo).
  ssl_certificate     /etc/letsencrypt/live/origenes.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/origenes.example.com/privkey.pem;

  # Solo TLS 1.2 y 1.3: SSL y TLS 1.0/1.1 son inseguros (clase 13).
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:origenes_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # El build de Vite (npm run build).
  root /var/www/origenes/apps/frontend/dist;
  index index.html;

  # Comprime HTML, CSS, JS, JSON y SVG antes de enviarlos.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # El logo de Identidad Visual viaja en base64 (hasta ~3 MB, D-09); la API rechaza lo que pase de su límite.
  client_max_body_size 4m;

  # ---------- API ----------
  # Todo lo que empieza con /api va a Express. Los encabezados de seguridad de la API
  # los pone helmet (app.js); por eso aquí no se repiten.
  location /api/ {
    proxy_pass http://origenes_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # La IP real del cliente: Express la usa para el límite de peticiones (TRUST_PROXY=1 en el .env).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ---------- Frontend ----------
  # Archivos con hash en el nombre (index-a1b2c3.js): pueden guardarse en caché un año.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  # React Router maneja /pos, /caja, /administracion…: si no existe el archivo, se entrega index.html.
  location / {
    try_files $uri $uri/ /index.html;

    # index.html se revisa en cada visita para que un despliegue nuevo se vea de inmediato.
    add_header Cache-Control "no-cache" always;

    # Encabezados de seguridad para las páginas (las respuestas de /api ya traen los de helmet).
    # HSTS: el navegador solo usará HTTPS con este dominio durante un año.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: scripts solo del propio sitio; estilos y fuentes también de Google Fonts;
    # imágenes locales o en base64 (logo y fotos subidas); la app solo habla con su propia API.
    # Si el frontend usa una API en otro dominio (VITE_API_URL), agrégalo en connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
